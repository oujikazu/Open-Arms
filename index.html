<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Arms ♡</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f3f5;
      color: #2f2730;
    }
    .card {
      width: min(100%, 520px);
      padding: 24px 22px 28px;
      text-align: center;
      background: rgba(255,255,255,.92);
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(45,30,45,.12);
    }
    img {
      display: block;
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
      border-radius: 16px;
      margin: 0 auto 14px;
    }
    .made {
      margin: 0 0 18px;
      font: 12px/1.4 Arial, sans-serif;
      letter-spacing: .08em;
      opacity: .62;
    }
    button, .download {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      margin: 4px;
      background: #2f2730;
      color: white;
      text-decoration: none;
      font: 13px/1 Arial, sans-serif;
      cursor: pointer;
    }
    button:active, .download:active { transform: scale(.98); }
    .quote {
      margin: 22px 0 12px;
      font-size: 17px;
      line-height: 1.55;
      font-style: italic;
    }
    .text {
      margin: 7px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .download {
      margin-top: 12px;
      background: transparent;
      color: #2f2730;
      border: 1px solid rgba(47,39,48,.28);
    }
    .signature {
      margin: 20px 0 0;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="Mandy%20Winion.png" alt="Bild">
    <p class="made">Made by Kuredox</p>

    <audio id="song" preload="metadata">
      <source src="Jorge%20Rivera-Herrans%20Steven%20Dookie%20-%20Open%20Arms.mp3" type="audio/mpeg">
    </audio>
    <button id="playButton" type="button">▶ Play Me</button>

    <p class="quote">“Someone Who Greets You with Open Arms~~”</p>
    <p class="text">Ich hoffe, du freust dich.</p>
    <p class="text">Wenn du das Bild Downloaden möchtest kannst du das hier tun.</p>

    <a class="download" href="Mandy%20Winion.png" download="Mandy-Winion.png">↓ Download Bild hier ↓</a>

    <p class="signature">Kazu ♡</p>
  </main>

  <script>
    const song = document.getElementById("song");
    const button = document.getElementById("playButton");

    button.addEventListener("click", async () => {
      if (song.paused) {
        try {
          await song.play();
          button.textContent = "❚❚ Pause";
        } catch (e) {
          button.textContent = "▶ Play Me";
        }
      } else {
        song.pause();
        button.textContent = "▶ Play Me";
      }
    });

    song.addEventListener("ended", () => {
      button.textContent = "▶ Play Me";
    });
  </script>
</body>
</html>
